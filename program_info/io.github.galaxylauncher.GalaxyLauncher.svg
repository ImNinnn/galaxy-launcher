  </g>
  <circle cx="128" cy="128" r="100" fill="url(#glow)"/>
  <!-- back half of the ring -->
  <ellipse cx="128" cy="128" rx="104" ry="30" transform="rotate(-18 128 128)" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.55"/>
  <circle cx="128" cy="128" r="62" fill="url(#planet)"/>
  <g clip-path="url(#planetClip)" opacity="0.22" fill="#ffffff">
