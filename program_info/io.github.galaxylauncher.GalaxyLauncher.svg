  <!-- front half of the ring drawn over the planet -->
  <path d="M 29.1 160.2 A 104 30 -18 0 0 226.9 95.8" transform="" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="186" cy="70" r="9" fill="#fff6d6"/>
  <circle cx="186" cy="70" r="18" fill="#fff1b8" opacity="0.25"/>
