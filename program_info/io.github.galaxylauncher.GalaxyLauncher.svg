  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#space)"/>
  <g fill="#ffffff">
    <circle cx="52" cy="58" r="2.2" opacity="0.9"/>
    <circle cx="198" cy="48" r="1.6" opacity="0.7"/>
    <circle cx="210" cy="190" r="2" opacity="0.8"/>
    <circle cx="40" cy="176" r="1.4" opacity="0.6"/>
