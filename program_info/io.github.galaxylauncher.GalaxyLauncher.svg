<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="space" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2a1650"/>
      <stop offset="0.6" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#07061a"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#e6d4ff"/>
      <stop offset="0.28" stop-color="#a77bff"/>
      <stop offset="0.68" stop-color="#6232d6"/>
      <stop offset="1" stop-color="#22105a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e9ff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#f3e9ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f3e9ff" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="128" cy="128" r="62"/></clipPath>
